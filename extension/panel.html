<!doctype html>
<meta charset="utf-8">
<style>
  :root {
    --bg: #ffffff; --bg-alt: #f6f7f9; --border: #e4e6ea; --text: #1c1e21; --text-dim: #6b7280;
    --accent: #007aff; --accent-tint: #e8f1ff; --accent-text: #0a63cc;
    --danger: #ff3b30; --danger-tint: #ffeceb;
    --ok: #34c759; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 1px rgba(16,24,40,.04);
    --radius: 10px; --radius-sm: 7px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1e21; --bg-alt: #26282c; --border: #37393f; --text: #f0f1f3; --text-dim: #9aa0a9;
      --accent: #409cff; --accent-tint: #15314f; --accent-text: #8cc4ff;
      --danger: #ff6961; --danger-tint: #3a1f1d;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 1px 1px rgba(0,0,0,.2);
    }
  }
  html, body { height: 100%; }
  body { font: 13px/1.45 -apple-system, "SF Pro Text", system-ui, sans-serif; margin: 0; color: var(--text); background: var(--bg);
    display: flex; flex-direction: column; }
  textarea, input, select, button { font: inherit; box-sizing: border-box; color: inherit; }
  .row { display: flex; gap: 6px; align-items: center; padding: 8px 10px; }
  [hidden] { display: none !important; }
  body:not(.details) #log .tool, body:not(.details) #log .out { display: none; }

  .top { border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px; }
  .brand svg { width: 24px; height: 24px; flex: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.12)); }
  .brand .name { font-weight: 650; font-size: 14.5px; letter-spacing: -.01em; }
  .brand .spacer { flex: 1; }

  #dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--text-dim); transition: background .15s; }
  #dot.ok { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  #dot.bad { background: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 18%, transparent); }

  input[type=text], input[type=password], input[type=number], textarea, select {
    background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 6px 9px; outline: none; transition: border-color .12s, box-shadow .12s;
  }
  input[type=text]:focus, input[type=password]:focus, input[type=number]:focus, textarea:focus, select:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint);
  }
  #token { flex: 1; min-width: 0; }
  #convo { flex: 1; min-width: 0; }

  button { border: 1px solid var(--border); background: var(--bg-alt); border-radius: var(--radius-sm);
    padding: 6px 11px; cursor: pointer; transition: background .12s, border-color .12s, transform .05s; }
  button:hover { border-color: color-mix(in srgb, var(--text-dim) 50%, var(--border)); }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: default; transform: none; }
  #gear { font-size: 14px; line-height: 1; padding: 6px 9px; }
  #go { flex: 1; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  #go:hover { background: color-mix(in srgb, var(--accent) 88%, black); border-color: color-mix(in srgb, var(--accent) 88%, black); }
  #stop { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); background: var(--danger-tint); }

  .row.settings-panel { background: var(--bg-alt); border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--text-dim); }

  #jump { position: fixed; right: 16px; bottom: 120px; border: 0; border-radius: 999px; padding: 7px 13px; background: var(--text);
    color: var(--bg); font: 600 12px system-ui, sans-serif; box-shadow: 0 4px 14px rgba(0,0,0,.25); }

  #log { flex: 1; overflow-y: auto; padding: 8px 10px; font: 12px/1.5 ui-monospace, "SF Mono", monospace; white-space: pre-wrap; word-break: break-word; }
  #log div { padding: 3px 0; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
  #log .task { font: 650 13px/1.4 -apple-system, system-ui, sans-serif; color: var(--text); padding-top: 12px; border: 0; }
  .tool { color: var(--accent-text); } .out { color: var(--text-dim); } .err { color: var(--danger); } .done { color: var(--ok); }
  #log .vision { font: 12px -apple-system, system-ui, sans-serif; color: color-mix(in srgb, var(--ok) 55%, var(--text) 10%);
    background: color-mix(in srgb, var(--ok) 10%, var(--bg)); border: 1px solid color-mix(in srgb, var(--ok) 25%, var(--border));
    border-radius: var(--radius-sm); padding: 5px 9px; margin: 3px 0; }
  #log .q { font: 650 13px -apple-system, system-ui, sans-serif; color: var(--text); padding-top: 10px; border: 0; }
  #log .step { font: 12px -apple-system, system-ui, sans-serif; color: var(--text-dim); padding-left: 10px; border: 0; }
  #log .think { font: italic 12px -apple-system, system-ui, sans-serif; color: var(--text-dim); padding-left: 10px; border: 0; opacity: .8; }
  #log .say { font: 12px -apple-system, system-ui, sans-serif; color: var(--text); padding-left: 10px; border: 0; }
  #log .result { font: 13px -apple-system, system-ui, sans-serif; color: var(--text); background: var(--bg-alt); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 12px; margin: 8px 0; box-shadow: var(--shadow); }
  #log .result.wait { background: color-mix(in srgb, #ffcc00 12%, var(--bg)); border-color: color-mix(in srgb, #ffcc00 45%, var(--border)); }
  #log a { color: var(--accent-text); }
  #log code { font: 11.5px ui-monospace, "SF Mono", monospace; background: color-mix(in srgb, var(--text-dim) 14%, transparent); border-radius: 4px; padding: 1px 4px; }
  .empty { color: var(--text-dim); font: 13px -apple-system, system-ui, sans-serif; padding: 14px 0; }

  .composer { border-top: 1px solid var(--border); padding: 10px; background: var(--bg); }
  textarea { width: 100%; height: 68px; resize: vertical; }
  #budget { width: 58px; }

  .toggles { display: flex; flex-wrap: wrap; gap: 6px; }
  .toggles label { display: flex; align-items: center; gap: 5px; border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 10px 4px 8px; font-size: 12px; color: var(--text-dim); cursor: pointer; background: var(--bg-alt); transition: all .12s; }
  .toggles label:has(input:checked) { background: var(--accent-tint); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); color: var(--accent-text); }
  /* Local vision only means anything when vision is on at all -- with it off, Read is already denied either way. */
  .toggles:has(#useVision:not(:checked)) label:has(#localVision) { display: none; }
  .toggles input[type=checkbox] { accent-color: var(--accent); margin: 0; }
  .controls-row { flex-wrap: wrap; }
</style>
<div class="row top brand">
  <svg viewBox="0 0 128 128" aria-hidden="true">
    <defs>
      <radialGradient id="hub-sheen" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
        <stop offset="55%" stop-color="#f4f4f6" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#d9dadf" stop-opacity="0.35"/>
      </radialGradient>
    </defs>
    <rect x="56" y="5" width="16" height="42" rx="8" fill="#FF3B30" transform="rotate(0 64 64)"/>
    <rect x="56" y="5" width="16" height="42" rx="8" fill="#FF9500" opacity="0.95" transform="rotate(45 64 64)"/>
    <rect x="56" y="5" width="16" height="42" rx="8" fill="#FFCC00" opacity="0.89" transform="rotate(90 64 64)"/>
    <rect x="56" y="5" width="16" height="42" rx="8" fill="#34C759" opacity="0.84" transform="rotate(135 64 64)"/>
    <rect x="56" y="5" width="16" height="42" rx="8" fill="#32ADE6" opacity="0.78" transform="rotate(180 64 64)"/>
    <rect x="56" y="5" width="16" height="42" rx="8" fill="#007AFF" opacity="0.73" transform="rotate(225 64 64)"/>
    <rect x="56" y="5" width="16" height="42" rx="8" fill="#5856D6" opacity="0.67" transform="rotate(270 64 64)"/>
    <rect x="56" y="5" width="16" height="42" rx="8" fill="#AF52DE" opacity="0.62" transform="rotate(315 64 64)"/>
    <circle cx="64" cy="64" r="15" fill="url(#hub-sheen)"/>
    <circle cx="64" cy="64" r="15" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  </svg>
  <span class="name">Take the Wheel</span>
  <span class="spacer"></span>
  <span id="dot" title="runner health"></span>
  <button id="gear" title="settings">⚙</button>
</div>
<div class="row top">
  <input id="token" type="password" placeholder="runner token">
</div>
<div class="row top settings-panel" id="settings" hidden>
  Action cards:
  <select id="fxCorner">
    <option value="tr">Top right</option><option value="tl">Top left</option>
    <option value="br">Bottom right</option><option value="bl">Bottom left</option>
  </select>
  <label><input id="details" type="checkbox"> Show command details</label>
</div>
<div class="row top settings-panel" id="visionSettings" hidden>
  Local vision server:
  <input id="ollamaUrl" style="flex: 2; min-width: 0" title="Ollama address, e.g. http://my-mac-mini:11434 or a Tailscale IP (empty = runner default)">
  <input id="visionModel" style="flex: 1; min-width: 0" title="Ollama vision model (empty = runner default)">
  <button id="visionTest">Test</button>
  <span id="visionResult"></span>
</div>
<div class="row top">
  <select id="convo" title="conversations"></select>
  <button id="new" title="new conversation">＋</button>
  <button id="del" title="delete this conversation">🗑</button>
</div>
<div id="log"></div>
<button id="jump" hidden>↓ Latest</button>
<div class="composer">
  <textarea id="task" placeholder="e.g. go to ebay.com and find the cheapest Buy It Now 1 oz gold eagle"></textarea>
  <div class="row controls-row" style="padding: 8px 0 0">
    <select id="model"><option value="haiku">Haiku</option><option value="sonnet">Sonnet</option><option value="opus">Opus</option></select>
    <select id="effort" title="reasoning effort (remembered per model)"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select>
    <span class="spacer" style="flex: 0 0 4px"></span>
    <div class="toggles">
      <label title="On: can take screenshots (ttw look / Read) when text alone isn't enough, e.g. a question about an image. Off: text only (state/extract/find) -- no screenshots at all, so it can't fall back to reading prices/listings visually instead of as text."><input id="useVision" type="checkbox" checked> Use vision</label>
      <label title="One web search per question it is unsure about"><input id="search" type="checkbox"> Search</label>
      <label title="Drive a canvas-based VM lab console across two tabs: the lab's instructions tab and the VM console's own 'Open in New Window' popout. Open both before pressing Go."><input id="lab" type="checkbox"> Lab mode</label>
      <label title="Lab mode only: every VM screenshot/verification goes through your local Ollama vision model instead of Claude's own (much pricier) vision. The Read tool is unavailable in this mode, so it can't fall back."><input id="localVision" type="checkbox"> Local vision</label>
      <label title="Lab mode only: Claude plans a section once (cheap), then a deterministic script executes it at zero further LLM cost, checking its own work with local vision. Falls back to the normal full agent automatically if a check fails."><input id="planMode" type="checkbox"> Plan mode</label>
    </div>
  </div>
  <div class="row" style="padding: 8px 0 0">
    $<input id="budget" type="number" step="0.05" min="0.05" value="0.50">
    <button id="go">Go</button><button id="stop">Stop</button>
  </div>
</div>
<script src="panel.js"></script>
