<!doctype html>
<meta charset="utf-8">
<style>
  html, body { height: 100%; }
  body { font: 13px system-ui, sans-serif; margin: 0; color: #222; display: flex; flex-direction: column; }
  textarea, input, select, button { font: inherit; box-sizing: border-box; }
  .row { display: flex; gap: 6px; align-items: center; padding: 6px 10px; }
  [hidden] { display: none !important; }
  body:not(.details) #log .tool, body:not(.details) #log .out { display: none; }
  .top { border-bottom: 1px solid #e5e5e5; flex-wrap: wrap; }
  #token { flex: 1; min-width: 0; }
  #convo { flex: 1; min-width: 0; }
  #dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: #aaa; }
  #dot.ok { background: #2a2; } #dot.bad { background: #d33; }
  #jump { position: fixed; right: 16px; bottom: 120px; border: 0; border-radius: 999px; padding: 6px 12px; background: #222; color: #fff;
    font: 600 12px system-ui, sans-serif; box-shadow: 0 2px 10px #0004; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 6px 10px; font: 12px ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
  #log div { padding: 2px 0; border-bottom: 1px solid #f0f0f0; }
  #log .task { font: 600 13px system-ui, sans-serif; color: #000; padding-top: 10px; border: 0; }
  .tool { color: #06c; } .out { color: #888; } .err { color: #c00; } .done { color: #080; }
  #log .vision { font: 12px system-ui, sans-serif; color: #063; background: #f0f8f4; border: 1px solid #cde8d8; border-radius: 6px; padding: 4px 8px; margin: 2px 0; }
  #log .q { font: 600 13px system-ui, sans-serif; color: #000; padding-top: 8px; border: 0; }
  #log .step { font: 12px system-ui, sans-serif; color: #245; padding-left: 10px; border: 0; }
  #log .think { font: italic 12px system-ui, sans-serif; color: #888; padding-left: 10px; border: 0; }
  #log .say { font: 12px system-ui, sans-serif; color: #333; padding-left: 10px; border: 0; }
  #log .result { font: 13px system-ui, sans-serif; color: #111; background: #eef8ee; border: 1px solid #bfe3bf; border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
  #log .result.wait { background: #fff6e0; border-color: #f0d38a; }
  .composer { border-top: 1px solid #e5e5e5; padding: 8px 10px; }
  textarea { width: 100%; height: 70px; resize: vertical; }
  #budget { width: 60px; }
  #go { flex: 1; } #stop { color: #b00; }
  .empty { color: #999; font: 13px system-ui, sans-serif; padding: 12px 0; }
</style>
<div class="row top">
  <span id="dot" title="runner health"></span>
  <input id="token" type="password" placeholder="runner token">
  <button id="gear" title="settings">⚙</button>
</div>
<div class="row top" id="settings" hidden>
  Action cards:
  <select id="fxCorner">
    <option value="tr">Top right</option><option value="tl">Top left</option>
    <option value="br">Bottom right</option><option value="bl">Bottom left</option>
  </select>
  <label><input id="details" type="checkbox"> Show command details</label>
</div>
<div class="row top" id="visionSettings" hidden>
  Local vision server:
  <input id="ollamaUrl" style="flex: 2; min-width: 0" title="Ollama address, e.g. http://my-mac-mini:11434 or a Tailscale IP (empty = runner default)">
  <input id="visionModel" style="flex: 1; min-width: 0" title="Ollama vision model (empty = runner default)">
  <button id="visionTest">Test</button>
  <span id="visionResult"></span>
</div>
<div class="row top">
  <select id="convo" title="conversations"></select>
  <button id="new" title="new conversation">＋</button>
  <button id="del" title="delete this conversation">🗑</button>
</div>
<div id="log"></div>
<button id="jump" hidden>↓ Latest</button>
<div class="composer">
  <textarea id="task" placeholder="e.g. go to ebay.com and find the cheapest Buy It Now 1 oz gold eagle"></textarea>
  <div class="row" style="padding: 6px 0 0">
    <select id="model"><option value="haiku">Haiku</option><option value="sonnet">Sonnet</option><option value="opus">Opus</option></select>
    <select id="effort" title="reasoning effort (remembered per model)"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select>
    <label title="One web search per question it is unsure about"><input id="search" type="checkbox"> Search</label>
    <label title="Drive a canvas-based VM lab console across two tabs: the lab's instructions tab and the VM console's own 'Open in New Window' popout. Open both before pressing Go."><input id="lab" type="checkbox"> Lab mode</label>
    <label title="Lab mode only: every VM screenshot/verification goes through your local Ollama vision model instead of Claude's own (much pricier) vision. The Read tool is unavailable in this mode, so it can't fall back."><input id="localVision" type="checkbox"> Local vision</label>
    $<input id="budget" type="number" step="0.05" min="0.05" value="0.50">
    <button id="go">Go</button><button id="stop">Stop</button>
  </div>
</div>
<script src="panel.js"></script>
